<div class="deviceInfo">
    <div class="title">
        <span class="name"></span>
        <div class="buttons">
            <button class="edit"><i class="icon-edit"></i><span class="mobileHidden"> Edit</span></button>
            <button class="remove"><i class="icon-trash"></i><span class="mobileHidden"> Remove</span></button>
            <button class="previous mobileHidden" title="Previous"><i class="icon-left"></i></button>
            <button class="next mobileHidden" title="Next"><i class="icon-right"></i></button>
        </div>
    </div>
    <div class="note"></div>
    <table class="summary">
        <tr style="display: none"><td>Host</td><td class="host"></td></tr>
        <tr style="display: none"><td>Port</td><td class="port"></td></tr>
        <tr style="display: none"><td>Manufacturer</td><td class="manufacturerName"></td></tr>
        <tr style="display: none"><td>Model</td><td class="modelName"></td></tr>
        <tr style="display: none"><td>ESPHome version</td><td class="esphomeVersion"></td></tr>
        <tr style="display: none"><td>Last seen</td><td class="lastSeen"></td></tr>
        <tr style="display: none"><td>Discovery</td><td class="discovery"></td></tr>
        <tr style="display: none"><td>Active</td><td class="active"></td></tr>
    </table>
    <div class="exposes title">
        <span class="name">Exposes</span>
    </div>
    <table class="exposes"></table>
</div>
